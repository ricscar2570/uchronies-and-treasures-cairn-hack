name: R2 Validation

on:
  push:
    branches: [development/r2-contamination-20261006]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test R2 when present
        run: |
          if [ -f scripts/test_contamination_r2.py ]; then
            python -m unittest discover -s scripts -p 'test_contamination_r2.py' -v
          fi
      - name: Prepare source snapshot without font binaries
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('.')
          with ZipFile('CHRONOCAIRN_R2_Sources.zip', 'w', ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or '.git' in path.parts:
                      continue
                  if path.suffix.lower() in {'.ttf', '.otf', '.woff', '.woff2', '.zip', '.pyc'}:
                      continue
                  if '__pycache__' in path.parts:
                      continue
                  archive.write(path, path.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CHRONOCAIRN-R2-Sources
          path: CHRONOCAIRN_R2_Sources.zip
          retention-days: 30
