name: R2 Validation

on:
  push:
    branches: [main, development/r2-contamination-20261006]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronocairn-r2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install checkpoint build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation
          python -m pip install reportlab==4.4.9 pypdf==5.9.0 PyMuPDF==1.26.7
      - name: Reproduce diagnostic without calibration
        run: python scripts/contamination_sim.py --runs 20000 --seed 42026
      - name: Regression tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s scripts -p 'test_contamination_r2.py' -v 2>&1 | tee reports/r2-tests.txt
      - name: Build manual and check geometry
        run: |
          python scripts/build-pdf.py
          python scripts/check_pdf_r2.py CHRONOCAIRN_Final_Complete.pdf
      - name: Package verified sources and manual without font binaries
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, subprocess
          paths=[Path(p) for p in subprocess.check_output(['git','ls-files']).decode().splitlines()]
          with ZipFile('CHRONOCAIRN_R2_1_Verified.zip','w',ZIP_DEFLATED) as archive:
              manifest=[]
              for path in sorted(paths):
                  if not path.is_file() or path.suffix.lower() in {'.ttf','.otf','.woff','.woff2','.zip','.pyc'}:
                      continue
                  archive.write(path,path.as_posix())
                  manifest.append(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.as_posix())
              pdf=Path('CHRONOCAIRN_Final_Complete.pdf')
              archive.write(pdf,pdf.name)
              manifest.append(hashlib.sha256(pdf.read_bytes()).hexdigest()+'  '+pdf.name)
              archive.writestr('SOURCE_COMMIT.txt',subprocess.check_output(['git','rev-parse','HEAD']))
              archive.writestr('SHA256SUMS.txt','\n'.join(manifest)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CHRONOCAIRN-R2-Verified
          path: |
            CHRONOCAIRN_R2_1_Verified.zip
            CHRONOCAIRN_Final_Complete.pdf
            reports/r2-tests.txt
            reports/r2-pdf-check.json
          retention-days: 90
