name: R2.2 Validation

on:
  push:
    branches: [main, development/r22-procedural-20261006]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronocairn-r22-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned checkpoint dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation
          python -m pip install -r scripts/requirements.txt
      - name: Reproduce frozen contamination diagnostic
        run: |
          python scripts/contamination_sim.py --runs 20000 --seed 42026 --output reports/r22-contamination-reproduction.json
          python -c "import json; from pathlib import Path; assert json.loads(Path('reports/r22-contamination-reproduction.json').read_text()) == json.loads(Path('reports/r2-contamination.json').read_text())"
      - name: Build canonical manual and separate fillable sheets
        run: |
          python scripts/build-pdf.py
          python scripts/build_sheets_r22.py
      - name: All regression and artifact tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee reports/r22-tests.txt
          python scripts/check_pdf_r22.py CHRONOCAIRN_Final_Complete.pdf
      - name: Package verified source revision and outputs
        run: python scripts/package_r22.py --source-commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: CHRONOCAIRN-R22-Verified
          path: |
            CHRONOCAIRN_R2_2_Verified.zip
            CHRONOCAIRN_Final_Complete.pdf
            downloads/CHRONOCAIRN_R2_2_*.pdf
            reports/r22-tests.txt
            reports/r22-pdf-check.json
          retention-days: 90
