title: "Uchronies & Treasures"
description: "A time-crime horror roleplaying game based on Cairn"
permalink: pretty
remote_theme: just-the-docs/just-the-docs
color_scheme: dark
encoding: UTF-8
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
include:
  - js
exclude:
  - scripts/
  - dist/
  - Gemfile
  - Gemfile.lock
  - README.md
  - THIRD_PARTY_NOTICES.md
  - LICENSE
logo: "/img/logo.svg"
back_to_top: true
back_to_top_text: "Back to top"
footer_content: "Written and designed by Riccardo Scaringi. Based on <a href=\"https://cairnrpg.com\">Cairn</a> by Yochai Gal. Game text licensed under <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a>."
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"
aux_links:
  "GitHub":
    - "https://github.com/riccardosgaringi/uchronies-and-treasures"
aux_links_new_tab: true
